<div class="orders-page">
  <h1>My Orders</h1>

  <div class="orders-list" *ngIf="!loading && orders.length > 0">
    <div class="order-card" *ngFor="let order of orders" [routerLink]="['/orders', order.id]">
      <div class="order-header">
        <span class="order-number">{{ order.orderNumber }}</span>
        <span class="order-status" [class]="getStatusClass(order.status)">{{ order.statusDisplay }}</span>
      </div>
      <div class="order-details">
        <div class="detail">
          <span class="label">Date</span>
          <span class="value">{{ order.createdAt | date:'mediumDate' }}</span>
        </div>
        <div class="detail">
          <span class="label">Items</span>
          <span class="value">{{ order.itemCount }}</span>
        </div>
        <div class="detail">
          <span class="label">Total</span>
          <span class="value price">${{ order.total | number:'1.2-2' }}</span>
        </div>
      </div>
      <div class="view-details">
        View Details →
      </div>
    </div>
  </div>

  <div class="empty-orders" *ngIf="!loading && orders.length === 0">
    <span class="icon">📦</span>
    <h2>No orders yet</h2>
    <p>Start shopping to see your orders here!</p>
    <a routerLink="/products" class="btn btn-primary">Browse Products</a>
  </div>

  <div class="loading" *ngIf="loading">Loading orders...</div>
</div>
