<div class="auth-page">
  <div class="auth-card">
    <h1>Create Account</h1>
    <p class="subtitle">Join us and start shopping</p>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-row">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" formControlName="firstName" placeholder="John">
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" formControlName="lastName" placeholder="Doe">
        </div>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="you@example.com">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="Min 8 characters">
      </div>

      <div class="form-group">
        <label>Phone (Optional)</label>
        <input type="tel" formControlName="phoneNumber" placeholder="+1 555 0100">
      </div>

      <div class="error" *ngIf="error">{{ error }}</div>

      <button type="submit" class="btn btn-primary btn-full" [disabled]="loading || registerForm.invalid">
        {{ loading ? 'Creating Account...' : 'Create Account' }}
      </button>
    </form>

    <p class="auth-link">
      Already have an account? <a routerLink="/login">Sign in</a>
    </p>
  </div>
</div>
