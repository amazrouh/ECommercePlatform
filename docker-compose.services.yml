version: '3.8'

services:
  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ecommerce-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong!Passw0rd
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - services-network

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: src/Services/ApiGateway/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - user-service
      - product-service
      - cart-service
      - order-service
    networks:
      - services-network

  # User Service
  user-service:
    build:
      context: .
      dockerfile: src/Services/UserService/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=UserDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=true;
      - Jwt__Secret=YourSuperSecretKeyThatIsAtLeast32CharactersLong!
      - Jwt__Issuer=ECommercePlatform
      - Jwt__Audience=ECommercePlatform
    depends_on:
      - sqlserver
    networks:
      - services-network

  # Product Service
  product-service:
    build:
      context: .
      dockerfile: src/Services/ProductService/Dockerfile
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=ProductDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=true;
      - Jwt__Secret=YourSuperSecretKeyThatIsAtLeast32CharactersLong!
      - Jwt__Issuer=ECommercePlatform
      - Jwt__Audience=ECommercePlatform
    depends_on:
      - sqlserver
    networks:
      - services-network

  # Cart Service
  cart-service:
    build:
      context: .
      dockerfile: src/Services/CartService/Dockerfile
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=CartDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=true;
      - Jwt__Secret=YourSuperSecretKeyThatIsAtLeast32CharactersLong!
      - Jwt__Issuer=ECommercePlatform
      - Jwt__Audience=ECommercePlatform
      - Services__ProductService=http://product-service:8080
    depends_on:
      - sqlserver
      - product-service
    networks:
      - services-network

  # Order Service
  order-service:
    build:
      context: .
      dockerfile: src/Services/OrderService/Dockerfile
    ports:
      - "5004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=OrderDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=true;
      - Jwt__Secret=YourSuperSecretKeyThatIsAtLeast32CharactersLong!
      - Jwt__Issuer=ECommercePlatform
      - Jwt__Audience=ECommercePlatform
    depends_on:
      - sqlserver
    networks:
      - services-network

networks:
  services-network:
    driver: bridge

volumes:
  sqlserver_data:
